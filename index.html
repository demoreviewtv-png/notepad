<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Notepad with Syntax Highlighting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #282a36;
            color: #f8f8f2;
            padding: 16px;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        input, select, button {
            font-size: 14px;
            padding: 8px 12px;
            border: 1px solid #44475a;
            border-radius: 4px;
            background-color: #44475a;
            color: #f8f8f2;
            outline: none;
        }
        input[type="text"] {
            flex-grow: 1;
            min-width: 150px;
        }
        button {
            background-color: #bd93f9;
            color: #282a36;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: #ff79c6;
        }
        /* CodeMirror Editor Custom Dimensions */
        .CodeMirror {
            flex-grow: 1;
            height: auto;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="text" id="filename" value="script" placeholder="File name">
        <select id="format">
            <option value="htmlmixed">.html (HTML)</option>
            <option value="python">.py (Python)</option>
            <option value="javascript">.js (JavaScript)</option>
            <option value="css">.css (CSS)</option>
            <option value="markdown">.md (Markdown)</option>
            <option value="null">.txt (Text)</option>
        </select>
        <button id="save-btn">Save File</button>
    </div>

    <textarea id="editor"></textarea>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/xml-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/html-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/javascript-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/css-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

    <script>
        // Starter boilerplates for each mode
        const templates = {
            htmlmixed: `<!DOCTYPE html>\n<html>\n<head>\n  <title>Title</title>\n</head>\n<body>\n  <h1>Hello, World!</h1>\n</body>\n</html>`,
            python: `def main():\n    print("Hello, World!")\n\nif __name__ == "__main__":\n    main()`,
            javascript: `function greet(name) {\n    console.log("Hello, " + name);\n}\n\ngreet("World");`,
            css: `body {\n    background-color: #282a36;\n    color: #ffffff;\n}`,
            markdown: `# Sample Markdown\n\n- Point 1\n- Point 2`,
            null: `Type plain text here...`
        };

        // File extensions mapping
        const extensions = {
            htmlmixed: 'html',
            python: 'py',
            javascript: 'js',
            css: 'css',
            markdown: 'md',
            null: 'txt'
        };

        // Initialize CodeMirror Editor
        const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
            lineNumbers: true,
            theme: 'dracula',
            mode: 'htmlmixed',
            autoCloseTags: true,
            autoCloseBrackets: true,
            lineWrapping: true
        });

        // Set initial content
        editor.setValue(templates.htmlmixed);

        // Auto-complete trigger on typing standard characters
        editor.on('inputRead', (cm, change) => {
            if (change.origin !== '+delete' && /[a-zA-Z<.]/.test(change.text[0])) {
                cm.showHint({ completeSingle: false });
            }
        });

        // Handle language dropdown change
        const formatSelect = document.getElementById('format');
        formatSelect.addEventListener('change', () => {
            const selectedMode = formatSelect.value;
            
            // Update syntax mode and editor template
            editor.setOption('mode', selectedMode);
            editor.setValue(templates[selectedMode] || '');
        });

        // Handle file download
        document.getElementById('save-btn').addEventListener('click', () => {
            const text = editor.getValue();
            const baseName = document.getElementById('filename').value.trim() || 'file';
            const selectedMode = formatSelect.value;
            const ext = extensions[selectedMode] || 'txt';
            const fileName = `${baseName}.${ext}`;

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        });
    </script>
</body>
</html>
